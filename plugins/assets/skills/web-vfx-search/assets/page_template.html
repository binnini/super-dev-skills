<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 후보 카드 세로 목록, 카드 왼쪽 = 미리보기 무대(게임 배경색 + 캐릭터 1칸 표시), 오른쪽 = 정보 */
:root {
  --unit-label: __UNITLABEL__;
  --bg: #f3f5f8; --surface: #ffffff; --fg: #18202b; --muted: #586374; --line: #d3dae4;
  --accent: #c99a06; --cc0: #2b7a4b; --paid: #a85a12; --check: #c0353a; --stage: #0b1620; --stage-line: #2a3b4c;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #161d26; --fg: #e5eaf0; --muted: #9aa5b4; --line: #2a3441;
  --accent: #f2c531; --cc0: #6ccb93; --paid: #e09a4c; --check: #f07a7d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d26; --fg: #e5eaf0; --muted: #9aa5b4; --line: #2a3441;
  --accent: #f2c531; --cc0: #6ccb93; --paid: #e09a4c; --check: #f07a7d; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15.5px; line-height: 1.65; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 36px 72px; display: flex; flex-direction: column; gap: 28px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); margin: 0; line-height: 1.2; }
h2 { font-size: 19px; margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 70ch; margin: 0; }
.need { display: flex; flex-wrap: wrap; gap: 8px; }
.need span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 13.5px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
button[aria-pressed="true"] { background: var(--accent); color: #1a1400; border-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 0; overflow: hidden; }
.card.chosen { outline: 3px solid var(--accent); }
@media (max-width: 720px) { .card { grid-template-columns: minmax(0, 1fr); } }
.stage { background: __STAGEBG__; display: flex; align-items: center; justify-content: center; min-height: 300px; position: relative; padding: 12px; }
.stage.light { background: #8aa0b4; }
.stage .holder { position: relative; display: inline-block; max-width: 100%; }
.stage img { display: block; image-rendering: pixelated; max-width: 100%; height: auto; }
.stage img.yellow { filter: __TINTFILTER__; }
.octo { position: absolute; left: 50%; top: 50%; border: 2px dashed #ff8a3d; transform: translate(-50%, -50%); pointer-events: none; }
.octo::after { content: var(--unit-label); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; font-size: 11px; color: #ffb27a; white-space: nowrap; }
.noscale { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: #9fb3c8; }
.info { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; justify-content: space-between; }
.rank { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; border: 1px solid currentColor; border-radius: 999px; padding: 0 9px; white-space: nowrap; }
.chip.own, .chip.zero, .chip.free, .chip.cc0 { color: var(--cc0); } .chip.paid { color: var(--paid); } .chip.check { color: var(--check); }
dl { margin: 0; display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 4px 10px; font-size: 14.5px; }
dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
dd { margin: 0; min-width: 0; }
ul { margin: 0; padding-left: 18px; font-size: 14.5px; display: flex; flex-direction: column; gap: 3px; }
.good li::marker { color: var(--cc0); } .bad li::marker { color: var(--check); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
a { color: inherit; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 12px 16px; max-width: 74ch; }
.note p { margin: 0; }
.excluded { font-size: 14.5px; color: var(--muted); }
.excluded ul { margin-top: 6px; }
#decision { font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
@media (prefers-reduced-motion: reduce) { .stage img { animation: none; } }
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__TITLE__</h1>
    <p class="lede">__LEDE__</p>
    <div class="need">__NEED__</div>
    <div class="bar">
      <button id="bgBtn" type="button" aria-pressed="false">밝은 배경으로 보기</button>
      <button id="yBtn" type="button" aria-pressed="false">__TINTLABEL__</button>
      <button id="starBtn" type="button" aria-pressed="false">☆ 고른 것만</button>
    </div>
  </header>

  __NOTE__

  <div id="list" style="display:flex;flex-direction:column;gap:18px"></div>

  <section class="excluded">
    <h2>유료 · 레퍼런스로만</h2>
    <p style="font-size:13.5px;color:var(--muted);margin:0 0 6px">돈을 내야 받을 수 있는 것은 후보에서 뺐습니다. 생김새만 보고 우리가 직접 그리거나 Forge 설정을 맞출 때 참고합니다.</p>
    <ul>__REFERENCE__</ul>
  </section>

  <section class="excluded">
    <h2>뺀 후보</h2>
    <ul>__EXCLUDED__</ul>
  </section>

  <section style="display:flex;flex-direction:column;gap:8px">
    <h2>결정</h2>
    <div id="decision">아직 결정하지 않았습니다.</div>
    <div class="bar"><button id="copyBtn" type="button">결정 · ☆ 목록 복사</button><span id="copyMsg" style="font-size:13px;color:var(--muted)"></span></div>
  </section>
</div>

<script>
const C = __DATA__;
const TITLE = __TITLEJSON__;
const UNIT = __UNITPX__;
const KEY = __KEYJSON__;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let stars = store.get(KEY + '_stars', []);
let choice = store.get(KEY + '_choice', null);
let onlyStars = false;
const tagName = { own: '직접 만듦', zero: '0원 가능', cc0: 'CC0', free: '무료', check: '확인 필요' };

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const c of C) {
    if (onlyStars && !stars.includes(c.id)) continue;
    const card = document.createElement('article');
    card.className = 'card' + (choice && choice.id === c.id ? ' chosen' : '');
    const w = c.disp ? Math.round(c.pw * c.disp) : null;
    const octo = c.disp ? `<div class="octo" style="width:${UNIT * 3}px;height:${UNIT * 3}px"></div>` : '';
    const imgStyle = w ? `width:${w}px` : '';
    const yellowable = !!c.recolor;
    card.innerHTML = `
      <div class="stage"><div class="holder"><img src="${c.img}" alt="${c.name} 미리보기" style="${imgStyle}" data-y="${yellowable ? 1 : 0}">${octo}</div>
        ${c.disp ? '' : '<div class="noscale">홍보 그림이라 실제 크기와 다를 수 있음</div>'}</div>
      <div class="info">
        <div class="top"><h2>${c.name}</h2><span class="rank">#${c.rank} · ${c.by}</span></div>
        <div><span class="chip ${c.licTag}">${tagName[c.licTag]}</span> <span style="font-size:13.5px;color:var(--muted)">${c.price}</span></div>
        <dl><dt>라이선스</dt><dd>${c.lic}</dd><dt>규격</dt><dd>${c.spec}</dd></dl>
        <ul class="good">${c.fit.map(x => `<li>${x}</li>`).join('')}</ul>
        <ul class="bad">${c.risk.map(x => `<li>${x}</li>`).join('')}</ul>
        <div class="actions">
          <button type="button" data-star="${c.id}" aria-pressed="${stars.includes(c.id)}">${stars.includes(c.id) ? '★ 고름' : '☆ 고르기'}</button>
          <button type="button" data-choose="${c.id}">이걸로 결정</button>
          <a href="${c.url}" target="_blank" rel="noopener" style="font-size:14px;align-self:center">원본 페이지</a>
        </div>
      </div>`;
    list.appendChild(card);
  }
  applyToggles();
  const d = document.getElementById('decision');
  d.textContent = choice ? `[VFX 결정] ${TITLE}: ${choice.name} (${choice.by}) ${choice.url}\n☆ ${stars.join(', ') || '없음'}` : `아직 결정하지 않았습니다.${stars.length ? '\n☆ ' + stars.join(', ') : ''}`;
}
function applyToggles() {
  const light = document.getElementById('bgBtn').getAttribute('aria-pressed') === 'true';
  const yellow = document.getElementById('yBtn').getAttribute('aria-pressed') === 'true';
  document.querySelectorAll('.stage').forEach(s => s.classList.toggle('light', light));
  document.querySelectorAll('img[data-y="1"]').forEach(i => i.classList.toggle('yellow', yellow));
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-star]');
  if (s) { const id = s.dataset.star; stars = stars.includes(id) ? stars.filter(x => x !== id) : [...stars, id]; store.set(KEY + '_stars', stars); render(); return; }
  const ch = e.target.closest('[data-choose]');
  if (ch) { const c = C.find(x => x.id === ch.dataset.choose); choice = { id: c.id, name: c.name, by: c.by, url: c.url, lic: c.lic }; store.set(KEY + '_choice', choice); render(); return; }
});
for (const id of ['bgBtn', 'yBtn']) document.getElementById(id).addEventListener('click', e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); applyToggles(); });
document.getElementById('starBtn').addEventListener('click', e => { onlyStars = !onlyStars; e.currentTarget.setAttribute('aria-pressed', onlyStars); render(); });
document.getElementById('copyBtn').addEventListener('click', () => {
  const t = document.getElementById('decision').textContent; const m = document.getElementById('copyMsg');
  navigator.clipboard.writeText(t).then(() => m.textContent = '복사했습니다. 대화에 붙여 넣어 주세요.').catch(() => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('decision')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); m.textContent = '선택해 두었습니다. Ctrl+C로 복사해 주세요.'; });
});
render();
</script>
